server.port=9999
filename.input=src//main//resources//subtitles.txt
filename.output=src//main//resources//subtitlesVocab.csv

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Enable debug logging for vocabulary application
logging.level.com.example.vocabulary=DEBUG
logging.level.org.springframework.web.client=DEBUG

# Optional: Enable debug for all Spring components (uncomment if needed)
# logging.level.org.springframework=DEBUG

# Java 21+ Virtual Threads Configuration
# Virtual threads are enabled by default in Java 21+
# No additional configuration needed - they're used in TextFileToCsvConverter

# API Configuration
api.read-timeout=5000
api.connect-timeout=10000
api.call-delay=5000